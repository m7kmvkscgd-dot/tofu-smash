<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>背中かき猿</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#f5e6c0;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  font-family:Georgia,serif;
  touch-action:none; overflow:hidden;
}
#scoreEl {
  color:#8B4513; font-size:20px; font-weight:bold;
  letter-spacing:3px; padding:8px 0 4px;
}
#wrap {
  position:relative;
  width:min(100vw, 340px);
  aspect-ratio:300/440;
}
#canvas {
  width:100%; height:100%;
  border:2px solid #c8a06044;
  border-radius:8px;
  display:block;
}
#vid {
  position:absolute; bottom:6px; right:6px;
  width:80px; height:60px; object-fit:cover;
  border-radius:4px; border:1px solid #8B451366;
  opacity:0; transition:opacity .3s;
}
#btns { display:flex; gap:10px; padding:8px 0 4px; }
.btn {
  padding:9px 18px; font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:4px; border:none;
}
#btnStart { background:#8B4513; color:#fff; }
#btnCam   { background:transparent; border:2px solid #8B451388; color:#8B4513; }
#statusEl { color:#8B451388; font-size:11px; padding-bottom:6px; }
</style>
</head>
<body>

<div id="scoreEl">笑い: <span id="scoreNum">0</span></div>
<div id="wrap">
  <canvas id="canvas" width="300" height="440"></canvas>
  <video id="vid" autoplay playsinline muted></video>
</div>
<div id="btns">
  <button class="btn" id="btnStart">START</button>
  <button class="btn" id="btnCam">📷 カメラON</button>
</div>
<div id="statusEl">AUTO MODE</div>

<script>
const W=300, H=440;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const vid=document.getElementById('vid');
const statusEl=document.getElementById('statusEl');
const scoreNumEl=document.getElementById('scoreNum');

let running=false, camOn=false, fingerY=null, score=0, animId=null;
let laughLevel=0, shakeX=0, shakeT=0;
let particles=[];

// おじさんの背中は画面上部に配置
const OJISAN_Y = 60;   // おじさん頭のY
const BACK_TOP = 160;  // 背中の上端
const BACK_H   = 100;  // 背中の高さ

// 猿の手は下から上へ
const hand = { x:150, y:300, dir:-1, speed:5, prevY:300 };

function newGame() {
  laughLevel=0; score=0; shakeX=0; shakeT=0; particles=[];
  scoreNumEl.textContent=0;
  hand.y=300; hand.dir=-1;
}

function onScratch() {
  score+=5; scoreNumEl.textContent=score;
  laughLevel=Math.min(3,Math.floor(score/25));
  shakeX=6; shakeT=10;
  spawnParts(150+(Math.random()-.5)*50, BACK_TOP+40, 5);
}

function spawnParts(x,y,n) {
  for(let i=0;i<n;i++) particles.push({
    x:x+(Math.random()-.5)*30, y,
    vx:(Math.random()-.5)*5, vy:-(Math.random()*6+2),
    sz:Math.random()*7+3, a:1,
    col:`hsl(${Math.random()*40+10},90%,65%)`
  });
}

// ── おじさん描画（上部・背中向き）──────────
function drawOjisan() {
  const cx=150+shakeX;
  const oy=OJISAN_Y;

  // 胴体（背中）
  ctx.fillStyle='#4a90d9';
  ctx.beginPath(); ctx.roundRect(cx-48,oy+55,96,105,[0,0,12,12]); ctx.fill();

  // シャツのしわ
  ctx.strokeStyle='rgba(255,255,255,0.25)'; ctx.lineWidth=1.5;
  for(let i=0;i<4;i++){
    ctx.beginPath();
    ctx.moveTo(cx-34+i*22, oy+65);
    ctx.quadraticCurveTo(cx-28+i*22, oy+105, cx-34+i*22, oy+145);
    ctx.stroke();
  }

  // 首
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.roundRect(cx-13,oy+42,26,20,6); ctx.fill();

  // 頭
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx,oy+22,34,28,0,0,Math.PI*2); ctx.fill();

  // 薄毛
  ctx.fillStyle='#5a3a1a';
  ctx.beginPath(); ctx.ellipse(cx,oy+4,22,10,0,0,Math.PI); ctx.fill();
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx,oy+12,15,8,0,0,Math.PI*2); ctx.fill();

  // 耳
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx-32,oy+24,7,9,-0.2,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+32,oy+24,7,9, 0.2,0,Math.PI*2); ctx.fill();

  // 腕
  ctx.fillStyle='#4a90d9';
  ctx.beginPath(); ctx.roundRect(cx-65,oy+58,20,75,8); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+45,oy+58,20,75,8); ctx.fill();

  // 手
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx-55,oy+140,11,13,0,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+55,oy+140,11,13,0,0,Math.PI*2); ctx.fill();

  // ズボン
  ctx.fillStyle='#2c3e6b';
  ctx.beginPath(); ctx.roundRect(cx-46,oy+158,92,60,[0,0,10,10]); ctx.fill();

  // ほっぺ（笑い）
  if(laughLevel>=1){
    const alpha=0.3+laughLevel*0.15;
    ctx.fillStyle=`rgba(255,100,100,${alpha})`;
    ctx.beginPath(); ctx.ellipse(cx-28,oy+28,11,8,0.3,0,Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+28,oy+28,11,8,-0.3,0,Math.PI*2); ctx.fill();
  }

  // 笑いテキスト
  const laughTexts=['','(´∀`*)','w w w !!','草草草草www'];
  if(laughLevel>=1){
    ctx.fillStyle=`rgba(200,40,40,${0.8+laughLevel*0.07})`;
    ctx.font=`bold ${13+laughLevel*3}px Georgia`;
    ctx.textAlign='center';
    ctx.fillText(laughTexts[laughLevel], cx, oy-8);
    ctx.textAlign='left';
  }

  // 大爆笑
  if(laughLevel>=3){
    ctx.fillStyle='rgba(255,180,0,0.8)';
    ctx.font='bold 14px Georgia';
    ctx.textAlign='center';
    ctx.fillText('ｗｗｗｗｗ', cx, oy-26);
    ctx.textAlign='left';
  }

  // かくかく線（手が背中に触れているとき）
  const tip=hand.y;
  if(tip<=BACK_TOP+BACK_H && tip>=BACK_TOP){
    ctx.strokeStyle='rgba(255,220,80,0.8)'; ctx.lineWidth=2;
    for(let i=0;i<4;i++){
      ctx.beginPath();
      ctx.moveTo(cx-20+i*14, tip-5);
      ctx.lineTo(cx-16+i*14+(Math.random()*8-4), tip+12);
      ctx.stroke();
    }
  }
}

// ── 猿の手描画 ───────────────────────────
function drawMonkeyHand() {
  const hx=150, hy=hand.y;

  // 腕
  ctx.fillStyle='#8B4513';
  ctx.beginPath(); ctx.roundRect(hx-11,hy,22,85,7); ctx.fill();

  // 毛
  ctx.strokeStyle='#6B3010'; ctx.lineWidth=1.5;
  for(let i=0;i<7;i++){
    ctx.beginPath(); ctx.moveTo(hx-12,hy+i*12); ctx.lineTo(hx-19,hy+i*12+7); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(hx+12,hy+i*12); ctx.lineTo(hx+19,hy+i*12+7); ctx.stroke();
  }

  // 手のひら
  ctx.fillStyle='#c68642';
  ctx.beginPath(); ctx.ellipse(hx,hy+85,19,14,0,0,Math.PI*2); ctx.fill();

  // 指4本
  [[-14,-0.4],[-5,-0.15],[5,0.15],[14,0.4]].forEach(([dx,ang])=>{
    ctx.save(); ctx.translate(hx+dx,hy+93); ctx.rotate(ang);
    ctx.fillStyle='#c68642';
    ctx.beginPath(); ctx.roundRect(-5,0,10,22,5); ctx.fill();
    ctx.fillStyle='#f0d090';
    ctx.beginPath(); ctx.roundRect(-3,15,6,8,3); ctx.fill();
    ctx.restore();
  });

  // 親指
  ctx.save(); ctx.translate(hx-21,hy+78); ctx.rotate(-0.8);
  ctx.fillStyle='#c68642';
  ctx.beginPath(); ctx.roundRect(-4,0,10,18,5); ctx.fill();
  ctx.fillStyle='#f0d090';
  ctx.beginPath(); ctx.roundRect(-2,12,6,6,3); ctx.fill();
  ctx.restore();
}

// ── 背景 ─────────────────────────────────
function drawBg() {
  ctx.fillStyle='#fff8e8';
  ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='rgba(180,140,80,0.2)'; ctx.lineWidth=1;
  for(let y=0;y<H;y+=40){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke(); }
  for(let x=0;x<W;x+=60){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke(); }
}

function drawParts() {
  for(const p of particles){
    ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz/2,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

function drawFingerLine() {
  if(!camOn||fingerY===null) return;
  ctx.strokeStyle='rgba(139,69,19,0.4)';
  ctx.lineWidth=1; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(0,fingerY); ctx.lineTo(W,fingerY); ctx.stroke();
  ctx.setLineDash([]);
}

// ── 更新 ─────────────────────────────────
function update() {
  hand.prevY=hand.y;

  if(camOn&&fingerY!==null){
    // カメラの指Y → 猿の手Y（上半分の動きを画面全体にマッピング）
    const mapped=fingerY*1.5;
    const target=Math.max(BACK_TOP-10, Math.min(H-20, mapped));
    hand.y+=(target-hand.y)*0.4;
  } else {
    hand.y+=hand.speed*hand.dir;
    if(hand.y<=BACK_TOP-20) { hand.dir=1; }
    if(hand.y>=H-20)        { hand.dir=-1; }
  }

  const tip=hand.y;
  const wasAbove=hand.prevY<=BACK_TOP;
  const hitting=tip>=BACK_TOP&&tip<BACK_TOP+BACK_H;

  if(hitting){
    if(camOn){
      if(Math.abs(hand.y-hand.prevY)>0.5) onScratch();
    } else {
      if(wasAbove){ onScratch(); hand.dir=1; }
    }
  }

  if(shakeT>0){ shakeT--; shakeX=shakeT>0?(Math.random()-.5)*8:0; }
  particles=particles.filter(p=>p.a>0.04);
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.a-=0.028; }
}

function render() {
  drawBg();
  drawFingerLine();
  drawOjisan();
  drawParts();
  drawMonkeyHand();
}

function loop() {
  if(!running) return;
  update(); render();
  animId=requestAnimationFrame(loop);
}

// ── カメラ ───────────────────────────────
let offscreen=null, offCtx=null, camStream=null, lastCamTime=0;
let prevBrightness=null;

async function startCam() {
  statusEl.textContent='カメラ起動中...';
  try {
    try {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{exact:'environment'},width:320,height:240}
      });
      vid.style.transform='scaleX(1)';
    } catch {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:320,height:240}
      });
      vid.style.transform='scaleX(-1)';
    }
    vid.srcObject=camStream; await vid.play();
    vid.style.opacity='0.85';
    offscreen=document.createElement('canvas');
    offscreen.width=40; offscreen.height=30;
    offCtx=offscreen.getContext('2d',{willReadFrequently:true});
    statusEl.textContent='🖐 指をカメラに向けて';
    camLoop();
  } catch(e) {
    statusEl.textContent='エラー: '+e.message;
    camOn=false;
    document.getElementById('btnCam').textContent='📷 カメラON';
  }
}

function stopCam() {
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  vid.style.opacity='0'; fingerY=null; prevBrightness=null;
}

function camLoop() {
  if(!camOn) return;
  requestAnimationFrame(camLoop);
  const now=performance.now();
  if(now-lastCamTime<60) return; // 約16fps
  lastCamTime=now;
  if(vid.readyState<2) return;

  offCtx.drawImage(vid,0,0,40,30);
  const data=offCtx.getImageData(0,0,40,30).data;

  // 各行の平均輝度を計算
  const rowBrightness=[];
  for(let y=0;y<30;y++){
    let sum=0;
    for(let x=0;x<40;x++){
      const i=(y*40+x)*4;
      sum+=(data[i]+data[i+1]+data[i+2])/3;
    }
    rowBrightness.push(sum/40);
  }

  // 最も明るい行を指先とみなす
  let maxB=0, maxY=0;
  for(let y=0;y<30;y++){
    if(rowBrightness[y]>maxB){ maxB=rowBrightness[y]; maxY=y; }
  }

  if(maxB>60){
    fingerY=(maxY/30)*H;
    statusEl.textContent=`👆 検出中 (${Math.round(fingerY)})`;
  } else {
    statusEl.textContent='🖐 指をカメラに向けて';
  }
}

document.getElementById('btnStart').addEventListener('click',()=>{
  if(running){
    running=false; cancelAnimationFrame(animId);
    document.getElementById('btnStart').textContent='START';
    newGame(); render();
  } else {
    running=true;
    document.getElementById('btnStart').textContent='STOP';
    loop();
  }
});

document.getElementById('btnCam').addEventListener('click',()=>{
  camOn=!camOn;
  if(camOn){
    document.getElementById('btnCam').textContent='📷 カメラOFF';
    startCam();
  } else {
    document.getElementById('btnCam').textContent='📷 カメラON';
    stopCam();
    statusEl.textContent='AUTO MODE';
  }
});

render();
</script>
</body>
</html>
