<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>背中かき猿</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#1a0a00;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  font-family:Georgia,serif;
  touch-action:none; overflow:hidden;
}
#scoreEl {
  color:#ff8c42; font-size:20px; font-weight:bold;
  letter-spacing:3px; padding:8px 0 4px;
  text-shadow:0 0 20px #ff8c4288;
}
#wrap {
  position:relative;
  width:min(100vw, 340px);
  aspect-ratio:300/460;
}
#canvas {
  width:100%; height:100%;
  border:2px solid #ff8c4244; border-radius:8px;
  background:#ffe8c0;
  display:block;
}
#vid {
  position:absolute; bottom:6px; right:6px;
  width:80px; height:60px; object-fit:cover;
  border-radius:4px; border:1px solid #ff8c4266;
  opacity:0; transition:opacity .3s;
}
#btns { display:flex; gap:10px; padding:8px 0 4px; }
.btn {
  padding:9px 18px; font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:2px; border:none;
}
#btnStart { background:#ff8c42; color:#1a0a00; }
#btnCam   { background:transparent; border:1px solid #ff8c4255; color:#ff8c42; }
#statusEl { color:#ff8c4266; font-size:11px; padding-bottom:6px; }
</style>
</head>
<body>

<div id="scoreEl">笑い: <span id="scoreNum">0</span></div>
<div id="wrap">
  <canvas id="canvas" width="300" height="460"></canvas>
  <video id="vid" autoplay playsinline muted></video>
</div>
<div id="btns">
  <button class="btn" id="btnStart">START</button>
  <button class="btn" id="btnCam">📷 カメラON</button>
</div>
<div id="statusEl">AUTO MODE</div>

<script>
const W=300, H=460;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const vid=document.getElementById('vid');
const statusEl=document.getElementById('statusEl');
const scoreNumEl=document.getElementById('scoreNum');

let running=false, camOn=false, fingerY=null, score=0, animId=null;
let laughLevel=0; // 0=無表情 1=ニヤ 2=笑い 3=大爆笑
let shakeX=0, shakeT=0;
let particles=[];

// 猿の手
const hand = { x:150, y:40, dir:1, speed:6, prevY:40 };

// おじさん背中のY座標
const BACK_TOP = 280;
const BACK_H   = 120;

function newGame() {
  laughLevel=0; score=0; shakeX=0; shakeT=0; particles=[];
  scoreNumEl.textContent=0;
  hand.y=40; hand.dir=1;
}

function onScratch() {
  score+=5; scoreNumEl.textContent=score;
  laughLevel = Math.min(3, Math.floor(score/30));
  shakeX=5; shakeT=8;
  spawnParts(150+Math.random()*60-30, BACK_TOP+30, 4);
}

function spawnParts(x,y,n) {
  for(let i=0;i<n;i++) particles.push({
    x:x+(Math.random()-.5)*40, y,
    vx:(Math.random()-.5)*4, vy:-(Math.random()*5+1),
    sz:Math.random()*8+3, a:1,
    col:`hsl(${Math.random()*30+10},90%,65%)`
  });
}

// ── おじさんを描く ──────────────────────
function drawOjisan() {
  const cx = 150 + shakeX;
  const by = 160; // 体のY起点

  // 体（背中向き）
  // 胴体
  ctx.fillStyle='#f5deb3';
  ctx.beginPath();
  ctx.roundRect(cx-45, by+40, 90, 100, 10);
  ctx.fill();

  // シャツ（背中）
  ctx.fillStyle='#4a90d9';
  ctx.beginPath();
  ctx.roundRect(cx-43, by+42, 86, 96, 10);
  ctx.fill();

  // シャツのしわ
  ctx.strokeStyle='rgba(255,255,255,0.2)';
  ctx.lineWidth=1.5;
  for(let i=0;i<3;i++){
    ctx.beginPath();
    ctx.moveTo(cx-30+i*22, by+55);
    ctx.quadraticCurveTo(cx-20+i*22, by+90, cx-30+i*22, by+125);
    ctx.stroke();
  }

  // 首
  ctx.fillStyle='#e8c49a';
  ctx.beginPath();
  ctx.roundRect(cx-12, by+28, 24, 22, 6);
  ctx.fill();

  // 頭（後ろ向き）
  ctx.fillStyle='#e8c49a';
  ctx.beginPath();
  ctx.ellipse(cx, by+10, 32, 28, 0, 0, Math.PI*2);
  ctx.fill();

  // 頭頂部の薄い髪
  ctx.fillStyle='#5a3a1a';
  ctx.beginPath();
  ctx.ellipse(cx, by-8, 20, 10, 0, 0, Math.PI);
  ctx.fill();
  // はげ部分
  ctx.fillStyle='#e8c49a';
  ctx.beginPath();
  ctx.ellipse(cx, by+2, 14, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // 耳
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx-30, by+12, 7, 9, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+30, by+12, 7, 9,  0.3, 0, Math.PI*2); ctx.fill();

  // 腕（両側）
  ctx.fillStyle='#4a90d9';
  ctx.beginPath(); ctx.roundRect(cx-60, by+45, 18, 70, 8); ctx.fill();
  ctx.beginPath(); ctx.roundRect(cx+42, by+45, 18, 70, 8); ctx.fill();

  // 手（左右）
  ctx.fillStyle='#e8c49a';
  ctx.beginPath(); ctx.ellipse(cx-51, by+122, 10, 12, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+51, by+122, 10, 12, 0, 0, Math.PI*2); ctx.fill();

  // 下半身
  ctx.fillStyle='#2c3e6b';
  ctx.beginPath(); ctx.roundRect(cx-40, by+138, 80, 60, [0,0,8,8]); ctx.fill();

  // 笑い表現（横から見えるほっぺ）
  if(laughLevel>=1){
    ctx.fillStyle=`rgba(255,100,100,${0.3+laughLevel*0.15})`;
    ctx.beginPath(); ctx.ellipse(cx-26, by+18, 10, 7, 0.3, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx+26, by+18, 10, 7, -0.3, 0, Math.PI*2); ctx.fill();
  }

  // 笑いテキスト
  if(laughLevel>=1){
    const texts=['','(´∀`)','w w w','草草草！！'];
    const sizes=[0,14,18,22];
    ctx.fillStyle=`rgba(220,50,50,${0.7+laughLevel*0.1})`;
    ctx.font=`bold ${sizes[laughLevel]}px Georgia`;
    ctx.textAlign='center';
    ctx.fillText(texts[laughLevel], cx+60, by+10);
    ctx.textAlign='left';
  }

  // 大爆笑なら体が揺れる追加演出
  if(laughLevel>=3){
    ctx.fillStyle='rgba(255,200,0,0.6)';
    ctx.font='bold 16px Georgia';
    ctx.textAlign='center';
    ctx.fillText('wwwww', cx, by-20);
    ctx.textAlign='left';
  }
}

// ── 猿の手を描く ──────────────────────
function drawMonkeyHand() {
  const hx=150, hy=hand.y;

  // 腕（毛むくじゃら）
  ctx.fillStyle='#8B4513';
  ctx.beginPath(); ctx.roundRect(hx-10, hy, 20, 80, 6); ctx.fill();
  // 毛
  ctx.strokeStyle='#6B3410'; ctx.lineWidth=1.5;
  for(let i=0;i<8;i++){
    ctx.beginPath();
    ctx.moveTo(hx-12+Math.random()*4, hy+i*10);
    ctx.lineTo(hx-18+Math.random()*4, hy+i*10+6);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(hx+8+Math.random()*4, hy+i*10);
    ctx.lineTo(hx+14+Math.random()*4, hy+i*10+6);
    ctx.stroke();
  }

  // 手のひら
  ctx.fillStyle='#c68642';
  ctx.beginPath(); ctx.ellipse(hx, hy+80, 18, 14, 0, 0, Math.PI*2); ctx.fill();

  // 指（4本）
  const fingers=[
    {dx:-14,dy:0,ang:-0.4},
    {dx:-5, dy:-4,ang:-0.15},
    {dx:5,  dy:-4,ang:0.15},
    {dx:14, dy:0, ang:0.4},
  ];
  fingers.forEach(f=>{
    ctx.save();
    ctx.translate(hx+f.dx, hy+88);
    ctx.rotate(f.ang);
    ctx.fillStyle='#c68642';
    ctx.beginPath(); ctx.roundRect(-5,0,10,20,5); ctx.fill();
    // 爪
    ctx.fillStyle='#f0d090';
    ctx.beginPath(); ctx.roundRect(-3,14,6,7,3); ctx.fill();
    ctx.restore();
  });

  // 親指
  ctx.save();
  ctx.translate(hx-20, hy+74);
  ctx.rotate(-0.8);
  ctx.fillStyle='#c68642';
  ctx.beginPath(); ctx.roundRect(-4,0,10,18,5); ctx.fill();
  ctx.fillStyle='#f0d090';
  ctx.beginPath(); ctx.roundRect(-2,12,6,6,3); ctx.fill();
  ctx.restore();

  // かく動作時の線
  if(hand.y+80 >= BACK_TOP && hand.y < BACK_TOP+BACK_H) {
    ctx.strokeStyle='rgba(255,200,100,0.7)';
    ctx.lineWidth=2;
    for(let i=0;i<3;i++){
      ctx.beginPath();
      ctx.moveTo(hx-8+i*8, hy+85);
      ctx.lineTo(hx-12+i*8+Math.random()*6, hy+100);
      ctx.stroke();
    }
  }
}

// ── 背景 ────────────────────────────────
function drawBg() {
  // 畳風背景
  ctx.fillStyle='#ffe8c0';
  ctx.fillRect(0,0,W,H);

  // 畳の線
  ctx.strokeStyle='rgba(180,140,80,0.3)'; ctx.lineWidth=1;
  for(let y=0;y<H;y+=40){
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
  for(let x=0;x<W;x+=60){
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
}

function drawParts() {
  for(const p of particles){
    ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz/2,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ── 指ライン ─────────────────────────────
function drawFingerLine() {
  if(!camOn||fingerY===null) return;
  ctx.strokeStyle='rgba(255,100,50,0.4)';
  ctx.lineWidth=1; ctx.setLineDash([5,5]);
  ctx.beginPath(); ctx.moveTo(0,fingerY); ctx.lineTo(W,fingerY); ctx.stroke();
  ctx.setLineDash([]);
}

// ── 更新 ─────────────────────────────────
function update() {
  hand.prevY=hand.y;
  if(camOn&&fingerY!==null){
    const target=Math.max(10,Math.min(H-100,fingerY-80));
    hand.y+=(target-hand.y)*0.35;
  } else {
    hand.y+=hand.speed*hand.dir;
    if(hand.y<=10)        { hand.dir=1;  hand.y=10; }
    if(hand.y>=H-100)     { hand.dir=-1; }
  }

  const tip=hand.y+80;
  const wasAbove=hand.prevY+80<=BACK_TOP;
  const hitting=tip>=BACK_TOP && hand.y<BACK_TOP+BACK_H;

  if(hitting){
    if(camOn){
      if(wasAbove&&(hand.y-hand.prevY)>0.3){ onScratch(); hand.y=BACK_TOP-80; }
    } else {
      if(wasAbove){ onScratch(); hand.dir=-1; hand.y=BACK_TOP-80; }
    }
  }

  if(shakeT>0){ shakeT--; shakeX=shakeT>0?(Math.random()-.5)*8:0; }
  particles=particles.filter(p=>p.a>0.04);
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.a-=0.03; }
}

function render() {
  drawBg();
  drawFingerLine();
  drawOjisan();
  drawParts();
  drawMonkeyHand();
}

function loop() {
  if(!running) return;
  update(); render();
  animId=requestAnimationFrame(loop);
}

// ── カメラ ───────────────────────────────
let offscreen=null, offCtx=null, camStream=null, lastCamTime=0;

async function startCam() {
  statusEl.textContent='カメラ起動中...';
  try {
    try {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{exact:'environment'},width:320,height:240}
      });
      vid.style.transform='scaleX(1)';
    } catch {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:320,height:240}
      });
      vid.style.transform='scaleX(-1)';
    }
    vid.srcObject=camStream; await vid.play();
    vid.style.opacity='0.85';
    offscreen=document.createElement('canvas');
    offscreen.width=80; offscreen.height=60;
    offCtx=offscreen.getContext('2d',{willReadFrequently:true});
    statusEl.textContent='🖐 指をカメラに向けて';
    camLoop();
  } catch(e) {
    statusEl.textContent='カメラエラー: '+e.message;
    camOn=false;
    document.getElementById('btnCam').textContent='📷 カメラON';
  }
}

function stopCam() {
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  vid.style.opacity='0'; fingerY=null;
}

function camLoop() {
  if(!camOn) return;
  requestAnimationFrame(camLoop);
  const now=performance.now();
  if(now-lastCamTime<80) return;
  lastCamTime=now;
  if(vid.readyState<2) return;
  offCtx.drawImage(vid,0,0,80,60);
  const data=offCtx.getImageData(0,0,80,60).data;
  let found=-1;
  outer:
  for(let y=0;y<60;y++){
    for(let x=5;x<75;x++){
      const i=(y*80+x)*4;
      if(isSkin(data[i],data[i+1],data[i+2])){ found=y; break outer; }
    }
  }
  if(found>=0){ fingerY=(found/60)*H; statusEl.textContent='👆 検出中'; }
  else { statusEl.textContent='🖐 指をカメラに向けて'; }
}

function isSkin(r,g,b){
  return r>95&&g>40&&b>20&&r>g&&r>b&&(r-Math.min(g,b))>15&&Math.abs(r-g)>15;
}

document.getElementById('btnStart').addEventListener('click',()=>{
  if(running){
    running=false; cancelAnimationFrame(animId);
    document.getElementById('btnStart').textContent='START';
    newGame(); render();
  } else {
    running=true;
    document.getElementById('btnStart').textContent='STOP';
    loop();
  }
});

document.getElementById('btnCam').addEventListener('click',()=>{
  camOn=!camOn;
  if(camOn){
    document.getElementById('btnCam').textContent='📷 カメラOFF';
    startCam();
  } else {
    document.getElementById('btnCam').textContent='📷 カメラON';
    stopCam();
    statusEl.textContent='AUTO MODE';
  }
});

render();
</script>
</body>
</html>
