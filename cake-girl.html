<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ケーキをあげよう</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#fff0f5;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  font-family:Georgia,serif;
  touch-action:none; overflow:hidden;
}
#scoreEl {
  color:#ff6b9d; font-size:20px; font-weight:bold;
  letter-spacing:3px; padding:8px 0 4px;
  text-shadow:0 0 10px #ff6b9d44;
}
#wrap {
  position:relative;
  width:min(100vw, 340px);
  aspect-ratio:300/440;
}
#canvas {
  width:100%; height:100%;
  border:2px solid #ffb3cc;
  border-radius:12px;
  display:block;
}
#vid {
  position:absolute; bottom:6px; right:6px;
  width:80px; height:60px; object-fit:cover;
  border-radius:4px; border:1px solid #ffb3cc;
  opacity:0; transition:opacity .3s;
}
#btns { display:flex; gap:10px; padding:8px 0 4px; }
.btn {
  padding:9px 18px; font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:20px; border:none;
}
#btnStart { background:#ff6b9d; color:#fff; }
#btnCam   { background:transparent; border:2px solid #ff6b9d88; color:#ff6b9d; }
#statusEl { color:#ff6b9d88; font-size:11px; padding-bottom:6px; }
</style>
</head>
<body>

<div id="scoreEl">ハート: <span id="scoreNum">0</span> 💕</div>
<div id="wrap">
  <canvas id="canvas" width="300" height="440"></canvas>
  <video id="vid" autoplay playsinline muted></video>
</div>
<div id="btns">
  <button class="btn" id="btnStart">START</button>
  <button class="btn" id="btnCam">📷 カメラON</button>
</div>
<div id="statusEl">AUTO MODE</div>

<script>
const W=300, H=440;
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const vid=document.getElementById('vid');
const statusEl=document.getElementById('statusEl');
const scoreNumEl=document.getElementById('scoreNum');

let running=false, camOn=false, fingerY=null, score=0, animId=null;
let happiness=0; // 0〜3
let particles=[];
let hearts=[];
let cakeY=50; // ケーキのY座標
let cakeDir=1, cakeSpeed=5;
let caught=false, catchTimer=0;

// 女の子の口の状態 (0=通常 1=ほほえみ 2=笑顔 3=大喜び)
const GIRL_Y=200; // 女の子の頭Y
const MOUTH_Y=GIRL_Y+320; // 口のY座標（寝転がり）

function newGame() {
  happiness=0; score=0; particles=[]; hearts=[];
  cakeY=50; cakeDir=1; caught=false; catchTimer=0;
  scoreNumEl.textContent=0;
}

function onCatch() {
  score+=10; scoreNumEl.textContent=score;
  happiness=Math.min(3,Math.floor(score/30));
  caught=true; catchTimer=20;
  spawnHearts(150, MOUTH_Y-20, 8);
  spawnParts(150, MOUTH_Y-20, 6);
}

function spawnHearts(x,y,n) {
  for(let i=0;i<n;i++) hearts.push({
    x:x+(Math.random()-.5)*60, y,
    vx:(Math.random()-.5)*3,
    vy:-(Math.random()*4+2),
    sz:Math.random()*16+8, a:1,
    hue:Math.random()*40+330
  });
}

function spawnParts(x,y,n) {
  for(let i=0;i<n;i++) particles.push({
    x:x+(Math.random()-.5)*40, y,
    vx:(Math.random()-.5)*5, vy:-(Math.random()*5+2),
    sz:Math.random()*8+3, a:1,
    col:`hsl(${Math.random()*60+300},90%,70%)`
  });
}

// ── 背景 ─────────────────────────────────
function drawBg() {
  // グラデーション背景
  const gr=ctx.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,'#fff0f8');
  gr.addColorStop(1,'#ffe0ee');
  ctx.fillStyle=gr; ctx.fillRect(0,0,W,H);

  // 床
  ctx.fillStyle='#ffd6e8';
  ctx.fillRect(0,H-60,W,60);
  ctx.strokeStyle='#ffb3cc'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(0,H-60); ctx.lineTo(W,H-60); ctx.stroke();

  // 星
  ctx.fillStyle='rgba(255,180,220,0.5)';
  [[30,30],[270,50],[60,120],[250,100],[150,20]].forEach(([x,y])=>{
    ctx.font='14px serif'; ctx.textAlign='center';
    ctx.fillText('✦',x,y);
  });
}

// ── 女の子（横向きに寝転がり）────────────
function drawGirl() {
  const cx=150;
  const gy=H-55; // 地面のY

  // 体（横向き）
  // 胴体
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath();
  ctx.ellipse(cx, gy-40, 70, 30, 0, 0, Math.PI*2);
  ctx.fill();

  // ワンピース
  ctx.fillStyle='#ff9ec4';
  ctx.beginPath();
  ctx.ellipse(cx, gy-40, 68, 28, 0, 0, Math.PI*2);
  ctx.fill();

  // ワンピースのフリル
  ctx.strokeStyle='#ff6b9d'; ctx.lineWidth=2;
  for(let i=0;i<6;i++){
    const fx=cx-60+i*22;
    ctx.beginPath();
    ctx.arc(fx, gy-14, 10, Math.PI, 0);
    ctx.stroke();
  }

  // 足
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath(); ctx.ellipse(cx+80, gy-35, 22, 12, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+95, gy-50, 18, 10, -0.5, 0, Math.PI*2); ctx.fill();

  // 靴
  ctx.fillStyle='#ff6b9d';
  ctx.beginPath(); ctx.ellipse(cx+108, gy-48, 14, 8, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(cx+98, gy-32, 12, 7, -0.1, 0, Math.PI*2); ctx.fill();

  // 首
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath(); ctx.ellipse(cx-65, gy-44, 12, 16, 0.2, 0, Math.PI*2); ctx.fill();

  // 頭
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath(); ctx.ellipse(cx-90, gy-50, 32, 30, 0.1, 0, Math.PI*2); ctx.fill();

  // 髪（後ろ）
  ctx.fillStyle='#5c2d0a';
  ctx.beginPath(); ctx.ellipse(cx-88, gy-52, 34, 32, 0.1, 0, Math.PI*2); ctx.fill();

  // 髪（前）
  ctx.fillStyle='#7a3d10';
  ctx.beginPath();
  ctx.moveTo(cx-118, gy-65);
  ctx.quadraticCurveTo(cx-130, gy-40, cx-120, gy-25);
  ctx.quadraticCurveTo(cx-105, gy-20, cx-95, gy-30);
  ctx.quadraticCurveTo(cx-100, gy-50, cx-118, gy-65);
  ctx.fill();

  // 顔（頭の前面）
  ctx.fillStyle='#ffe8d5';
  ctx.beginPath(); ctx.ellipse(cx-95, gy-52, 24, 26, 0.1, 0, Math.PI*2); ctx.fill();

  // 目
  ctx.fillStyle='#3a1a00';
  ctx.beginPath(); ctx.ellipse(cx-101, gy-57, 5, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(cx-100, gy-58, 2, 2.5, 0, 0, Math.PI*2); ctx.fill();

  // まつ毛
  ctx.strokeStyle='#3a1a00'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(cx-106,gy-63); ctx.lineTo(cx-110,gy-67); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-102,gy-64); ctx.lineTo(cx-103,gy-69); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(cx-97, gy-63); ctx.lineTo(cx-96, gy-68); ctx.stroke();

  // 口
  const mouthExpr=[
    ()=>{ ctx.beginPath(); ctx.arc(cx-87,gy-46,5,0.1,Math.PI-0.1); ctx.stroke(); }, // 通常
    ()=>{ ctx.beginPath(); ctx.arc(cx-87,gy-47,6,-0.2,Math.PI+0.2); ctx.stroke(); }, // ほほえみ
    ()=>{ // 笑顔
      ctx.fillStyle='#3a1a00';
      ctx.beginPath(); ctx.arc(cx-87,gy-48,7,0,Math.PI); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.beginPath(); ctx.arc(cx-87,gy-46,5,0,Math.PI); ctx.fill();
    },
    ()=>{ // 大喜び（口開いてる）
      ctx.fillStyle='#3a1a00';
      ctx.beginPath(); ctx.arc(cx-87,gy-48,9,0,Math.PI*2); ctx.fill();
      ctx.fillStyle='#ff8888';
      ctx.beginPath(); ctx.arc(cx-87,gy-46,7,0,Math.PI); ctx.fill();
      ctx.fillStyle='#fff';
      ctx.fillRect(cx-93,gy-50,5,4);
      ctx.fillRect(cx-87,gy-50,5,4);
    }
  ];
  ctx.strokeStyle='#c06040'; ctx.lineWidth=1.5;
  mouthExpr[happiness]();

  // ほっぺ
  ctx.fillStyle=`rgba(255,150,150,${0.2+happiness*0.1})`;
  ctx.beginPath(); ctx.ellipse(cx-82,gy-50,8,5,0,0,Math.PI*2); ctx.fill();

  // 腕（上に伸びてる）
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath();
  ctx.moveTo(cx-55, gy-55);
  ctx.quadraticCurveTo(cx-30, gy-90, cx-10, gy-110);
  ctx.lineWidth=14; ctx.strokeStyle='#ffe0ee'; ctx.stroke();

  // 手（口元へ）
  ctx.fillStyle='#ffe0ee';
  ctx.beginPath(); ctx.ellipse(cx-8, gy-115, 14, 10, 0.5, 0, Math.PI*2); ctx.fill();

  // 口のY（ケーキをキャッチする位置）
  return { mouthX: cx-87, mouthY: gy-48 };
}

// ── ケーキ ────────────────────────────────
function drawCake(x, y) {
  // 皿
  ctx.fillStyle='#fff';
  ctx.beginPath(); ctx.ellipse(x, y+20, 22, 8, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle='#ddd'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.ellipse(x, y+20, 22, 8, 0, 0, Math.PI*2); ctx.stroke();

  // ケーキ本体
  ctx.fillStyle='#f5c9a0';
  ctx.beginPath(); ctx.roundRect(x-16, y-5, 32, 26, 4); ctx.fill();

  // クリーム
  ctx.fillStyle='#fff5f5';
  ctx.beginPath();
  ctx.moveTo(x-16, y-5);
  for(let i=0;i<4;i++){
    ctx.arc(x-10+i*8, y-5, 6, Math.PI, 0);
  }
  ctx.fill();

  // イチゴ
  ctx.fillStyle='#ff4466';
  ctx.beginPath(); ctx.arc(x, y-16, 7, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='#44aa44';
  ctx.beginPath(); ctx.moveTo(x, y-23); ctx.lineTo(x-4,y-28); ctx.lineTo(x,y-25); ctx.lineTo(x+4,y-28); ctx.closePath(); ctx.fill();

  // ろうそく
  ctx.fillStyle='#ffcc00';
  ctx.fillRect(x-2, y-26, 4, 10);
  ctx.fillStyle='#ff8800';
  ctx.beginPath(); ctx.arc(x, y-28, 4, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,200,0,0.6)';
  ctx.beginPath(); ctx.arc(x, y-28, 7, 0, Math.PI*2); ctx.fill();
}

// ── ハート描画 ────────────────────────────
function drawHeart(x, y, sz, hue) {
  ctx.fillStyle=`hsl(${hue},90%,65%)`;
  ctx.save(); ctx.translate(x,y); ctx.scale(sz/20, sz/20);
  ctx.beginPath();
  ctx.moveTo(0,-5);
  ctx.bezierCurveTo(5,-10,10,-5,0,5);
  ctx.bezierCurveTo(-10,-5,-5,-10,0,-5);
  ctx.fill();
  ctx.restore();
}

// ── メインループ ──────────────────────────
function update() {
  if(caught){
    catchTimer--;
    if(catchTimer<=0){ caught=false; cakeY=50; }
    return;
  }

  if(camOn&&fingerY!==null){
    const target=Math.max(20,Math.min(H-80,fingerY));
    cakeY+=(target-cakeY)*0.4;
  } else {
    cakeY+=cakeSpeed*cakeDir;
    if(cakeY<=30)   { cakeDir=1; cakeY=30; }
    if(cakeY>=H-100){ cakeDir=-1; }
  }

  // 口との距離でキャッチ判定
  const mouthX=150-87, mouthY=H-55-48;
  const dist=Math.sqrt((150-mouthX)**2+(cakeY-mouthY)**2);
  if(dist<30) onCatch();

  // ハート更新
  hearts=hearts.filter(h=>h.a>0.05);
  for(const h of hearts){ h.x+=h.vx; h.y+=h.vy; h.vy+=0.05; h.a-=0.02; }
  particles=particles.filter(p=>p.a>0.04);
  for(const p of particles){ p.x+=p.vx; p.y+=p.vy; p.vy+=0.15; p.a-=0.025; }
}

function render() {
  drawBg();
  const {mouthX,mouthY}=drawGirl();

  // ケーキ
  if(!caught) drawCake(150, cakeY);

  // ハート
  for(const h of hearts){
    ctx.globalAlpha=h.a;
    drawHeart(h.x, h.y, h.sz, h.hue);
  }
  ctx.globalAlpha=1;

  // パーティクル
  for(const p of particles){
    ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.sz/2,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // 指ライン
  if(camOn&&fingerY!==null){
    ctx.strokeStyle='rgba(255,100,150,0.4)';
    ctx.lineWidth=1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(0,fingerY); ctx.lineTo(W,fingerY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 幸福度テキスト
  const texts=['','おいしそう♪','やったー！💕','最高〜！！💖'];
  if(happiness>=1){
    ctx.fillStyle=`rgba(255,80,140,0.9)`;
    ctx.font=`bold ${14+happiness*3}px Georgia`;
    ctx.textAlign='center';
    ctx.fillText(texts[happiness], 150, 30);
    ctx.textAlign='left';
  }
}

function loop() {
  if(!running) return;
  update(); render();
  animId=requestAnimationFrame(loop);
}

// ── カメラ ───────────────────────────────
let offscreen=null, offCtx=null, camStream=null, lastCamTime=0;

async function startCam() {
  statusEl.textContent='カメラ起動中...';
  try {
    try {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:{exact:'environment'},width:320,height:240}
      });
      vid.style.transform='scaleX(1)';
    } catch {
      camStream=await navigator.mediaDevices.getUserMedia({
        video:{facingMode:'user',width:320,height:240}
      });
      vid.style.transform='scaleX(-1)';
    }
    vid.srcObject=camStream; await vid.play();
    vid.style.opacity='0.85';
    offscreen=document.createElement('canvas');
    offscreen.width=40; offscreen.height=30;
    offCtx=offscreen.getContext('2d',{willReadFrequently:true});
    statusEl.textContent='🖐 指をカメラに向けて';
    camLoop();
  } catch(e) {
    statusEl.textContent='エラー: '+e.message;
    camOn=false;
    document.getElementById('btnCam').textContent='📷 カメラON';
  }
}

function stopCam() {
  if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  vid.style.opacity='0'; fingerY=null;
}

function camLoop() {
  if(!camOn) return;
  requestAnimationFrame(camLoop);
  const now=performance.now();
  if(now-lastCamTime<60) return;
  lastCamTime=now;
  if(vid.readyState<2) return;
  offCtx.drawImage(vid,0,0,40,30);
  const data=offCtx.getImageData(0,0,40,30).data;
  let maxB=0, maxY=0;
  for(let y=0;y<30;y++){
    let sum=0;
    for(let x=0;x<40;x++){
      const i=(y*40+x)*4;
      sum+=(data[i]+data[i+1]+data[i+2])/3;
    }
    if(sum/40>maxB){ maxB=sum/40; maxY=y; }
  }
  if(maxB>60){ fingerY=(maxY/30)*H; statusEl.textContent='👆 検出中'; }
  else { statusEl.textContent='🖐 指をカメラに向けて'; }
}

document.getElementById('btnStart').addEventListener('click',()=>{
  if(running){
    running=false; cancelAnimationFrame(animId);
    document.getElementById('btnStart').textContent='START';
    newGame(); render();
  } else {
    running=true;
    document.getElementById('btnStart').textContent='STOP';
    loop();
  }
});

document.getElementById('btnCam').addEventListener('click',()=>{
  camOn=!camOn;
  if(camOn){
    document.getElementById('btnCam').textContent='📷 カメラOFF';
    startCam();
  } else {
    document.getElementById('btnCam').textContent='📷 カメラON';
    stopCam();
    statusEl.textContent='AUTO MODE';
  }
});

render();
</script>
</body>
</html>
