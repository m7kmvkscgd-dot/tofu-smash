<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>豆腐スマッシュ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a0a00;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; overflow:hidden;
  font-family:Georgia,serif; touch-action:none;
}
#score-display {
  color:#ff8c42; font-size:24px; font-weight:bold;
  letter-spacing:4px; margin-bottom:12px;
  text-shadow:0 0 20px #ff8c4288;
}
#wrapper { position:relative; width:300px; height:500px; }
#canvas {
  display:block; border:2px solid #ff8c4244;
  border-radius:4px; background:#0d0500;
  box-shadow:0 0 40px #ff8c4222;
}
#camPreview {
  position:absolute; bottom:8px; right:8px;
  width:90px; height:70px; border-radius:4px;
  border:1px solid #ff8c4266; object-fit:cover;
  opacity:0; transition:opacity 0.3s;
}
#overlay {
  position:absolute; top:0; left:0;
  width:90px; height:70px;
  bottom:8px; right:8px;
  pointer-events:none;
}
#controls {
  margin-top:16px; display:flex;
  gap:12px; flex-wrap:wrap; justify-content:center;
}
.btn {
  background:#ff8c42; color:#1a0a00;
  border:none; padding:10px 20px;
  font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:2px;
}
.btn.off {
  background:transparent;
  border:1px solid #ff8c4266; color:#ff8c42;
}
#info { color:#ff8c4266; font-size:11px; margin-top:8px; text-align:center; }
#status { color:#ff8c4244; font-size:10px; margin-top:4px; text-align:center; }
</style>
</head>
<body>
<div id="score-display">SMASH: <span id="score">0</span></div>
<div id="wrapper">
  <canvas id="canvas" width="300" height="500"></canvas>
  <video id="camPreview" autoplay playsinline muted></video>
</div>
<div id="controls">
  <button class="btn" id="startBtn">START</button>
  <button class="btn off" id="camBtn">📷 カメラON</button>
</div>
<div id="info">AUTO MODE</div>
<div id="status">準備完了</div>

<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.2.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/hand-pose-detection@2.0.0/dist/hand-pose-detection.min.js"></script>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = 300, H = 500;
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');

let score = 0, running = false, animId = null;
let cameraMode = false, fingerY = null;
let detector = null, detecting = false;
let videoStream = null;

const rod = { x:150, y:80, w:24, h:100, dir:1, speed:8, prevY:80 };
const tofu = { x:90, y:340, w:120, h:100, hp:100, maxHp:100, cracks:[], shakeX:0, shakeTimer:0, dead:false };
let particles = [];

function resetTofu() {
  Object.assign(tofu, { hp:100, cracks:[], shakeX:0, shakeTimer:0, dead:false });
  particles = [];
}

function addCrack() {
  tofu.cracks.push({
    cx: tofu.x + Math.random()*tofu.w,
    cy: tofu.y + Math.random()*tofu.h,
    angle: Math.random()*Math.PI,
    len: 10 + Math.random()*30
  });
}

function spawnParticles(x, y, n) {
  for (let i=0; i<n; i++) particles.push({
    x: x+(Math.random()-.5)*tofu.w, y,
    vx:(Math.random()-.5)*5, vy:-(Math.random()*6+2),
    size:Math.random()*8+3, alpha:1,
    color:`hsl(${40+Math.random()*20},80%,${70+Math.random()*20}%)`
  });
}

function hitTofu() {
  tofu.hp = Math.max(0, tofu.hp - 7);
  score += 7;
  document.getElementById('score').textContent = score;
  tofu.shakeX = 6; tofu.shakeTimer = 8;
  addCrack();
  if (tofu.hp < 50) addCrack();
  spawnParticles(tofu.x+tofu.w/2, tofu.y, 5);
  if (tofu.hp <= 0) {
    tofu.dead = true;
    spawnParticles(tofu.x+tofu.w/2, tofu.y+tofu.h/2, 20);
    setTimeout(resetTofu, 800);
  }
}

function draw() {
  // BG
  ctx.fillStyle='#0d0500'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ff8c4222'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H-40); ctx.lineTo(W,H-40); ctx.stroke();

  // finger line
  if (cameraMode && fingerY !== null) {
    ctx.strokeStyle='rgba(255,140,66,0.4)';
    ctx.setLineDash([4,4]);
    ctx.beginPath(); ctx.moveTo(0,fingerY); ctx.lineTo(W,fingerY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // tofu
  if (!tofu.dead) {
    const tx = tofu.x+tofu.shakeX;
    const dmg = 1 - tofu.hp/tofu.maxHp;
    const w = Math.floor(220 - dmg*60);
    ctx.fillStyle=`rgb(${w},${w},${w-10})`;
    ctx.beginPath(); ctx.roundRect(tx,tofu.y,tofu.w,tofu.h,4); ctx.fill();
    ctx.strokeStyle='rgba(200,200,200,0.2)'; ctx.lineWidth=0.5;
    for(let i=1;i<4;i++){
      ctx.beginPath(); ctx.moveTo(tx+8,tofu.y+(tofu.h/4)*i); ctx.lineTo(tx+tofu.w-8,tofu.y+(tofu.h/4)*i); ctx.stroke();
    }
    const hp = tofu.hp/tofu.maxHp;
    ctx.fillStyle='#222'; ctx.fillRect(tx,tofu.y-12,tofu.w,6);
    ctx.fillStyle = hp>.5?'#4ade80':hp>.25?'#facc15':'#f87171';
    ctx.fillRect(tx,tofu.y-12,tofu.w*hp,6);
    tofu.cracks.forEach(c=>{
      ctx.save(); ctx.translate(c.cx+tofu.shakeX,c.cy); ctx.rotate(c.angle);
      ctx.strokeStyle='rgba(100,80,60,0.8)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-c.len/2,0); ctx.lineTo(c.len/2,0); ctx.stroke();
      ctx.restore();
    });
  }

  // particles
  particles.forEach(p=>{
    ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color;
    ctx.beginPath(); ctx.roundRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size,2); ctx.fill();
  });
  ctx.globalAlpha=1;

  // rod
  const rx = rod.x-rod.w/2;
  const gr = ctx.createLinearGradient(rx,0,rx+rod.w,0);
  gr.addColorStop(0,'#c0712a'); gr.addColorStop(.3,'#f0a060');
  gr.addColorStop(.7,'#e08040'); gr.addColorStop(1,'#a05020');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.roundRect(rx,rod.y,rod.w,rod.h,6); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.2)';
  ctx.beginPath(); ctx.roundRect(rx+4,rod.y+4,6,rod.h-8,3); ctx.fill();
  if (rod.y+rod.h > tofu.y-20) {
    ctx.fillStyle='rgba(255,180,80,0.3)';
    ctx.beginPath(); ctx.ellipse(rod.x,rod.y+rod.h,rod.w/2,8,0,0,Math.PI*2); ctx.fill();
  }
}

function update() {
  rod.prevY = rod.y;

  if (cameraMode && fingerY !== null) {
    const ty = Math.min(Math.max(fingerY-rod.h, 10), H-rod.h-20);
    rod.y += (ty-rod.y)*0.3;
  } else {
    rod.y += rod.speed * rod.dir;
    if (rod.y <= 20) { rod.dir=1; rod.y=20; }
  }

  const rb = rod.y+rod.h;
  const wasAbove = rod.prevY+rod.h <= tofu.y;

  if (!tofu.dead && rb >= tofu.y && rod.y < tofu.y+tofu.h) {
    if (cameraMode) {
      if (wasAbove && rod.y-rod.prevY > 0.5) { hitTofu(); rod.y=tofu.y-rod.h; }
    } else if (wasAbove) {
      hitTofu(); rod.dir=-1; rod.y=tofu.y-rod.h;
    }
  }

  if (tofu.shakeTimer>0) {
    tofu.shakeTimer--;
    tofu.shakeX = tofu.shakeTimer>0 ? (Math.random()-.5)*6 : 0;
  }

  particles = particles.filter(p=>p.alpha>0.05);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.2; p.alpha-=0.03; p.size*=0.97; });
}

function loop() {
  if (!running) return;
  update(); draw();
  animId = requestAnimationFrame(loop);
}

// カメラ + TF.js hand detection
async function startCamera() {
  try {
    statusEl.textContent = 'カメラ起動中...';
    const video = document.getElementById('camPreview');

    // アウトカメラ優先
    try {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:{exact:'environment'}, width:320, height:240 }
      });
    } catch(e) {
      videoStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'user', width:320, height:240 }
      });
    }
    video.srcObject = videoStream;
    await video.play();
    video.style.opacity = '0.8';
    statusEl.textContent = 'モデル読込中...';

    // TF.js detector
    detector = await handPoseDetection.createDetector(
      handPoseDetection.SupportedModels.MediaPipeHands,
      { runtime:'tfjs', modelType:'lite', maxHands:1 }
    );

    statusEl.textContent = '👆 指をカメラに向けて';
    detectLoop(video);
  } catch(e) {
    statusEl.textContent = 'エラー: ' + e.message;
    cameraMode = false;
  }
}

let lastDetect = 0;
async function detectLoop(video) {
  if (!cameraMode) return;
  const now = Date.now();
  if (now - lastDetect > 80) { // 約12fps
    lastDetect = now;
    try {
      const hands = await detector.estimateHands(video);
      if (hands.length > 0) {
        const kp = hands[0].keypoints;
        const tip = kp[8]; // 人差し指先端
        fingerY = (tip.y / 240) * H;
        statusEl.textContent = '👆 検出中';
      } else {
        statusEl.textContent = '指をカメラに向けて';
      }
    } catch(e) {}
  }
  requestAnimationFrame(() => detectLoop(video));
}

function stopCamera() {
  if (videoStream) { videoStream.getTracks().forEach(t=>t.stop()); videoStream=null; }
  document.getElementById('camPreview').style.opacity='0';
  fingerY = null;
  statusEl.textContent = '停止';
}

document.getElementById('startBtn').addEventListener('click', () => {
  if (running) {
    running=false; cancelAnimationFrame(animId);
    document.getElementById('startBtn').textContent='START';
    score=0; document.getElementById('score').textContent=0;
    rod.y=80; rod.dir=1; resetTofu(); draw();
  } else {
    running=true;
    document.getElementById('startBtn').textContent='STOP';
    loop();
  }
});

document.getElementById('camBtn').addEventListener('click', () => {
  cameraMode = !cameraMode;
  if (cameraMode) {
    document.getElementById('camBtn').textContent='📷 カメラOFF';
    document.getElementById('camBtn').classList.remove('off');
    infoEl.textContent='CAMERA MODE — 人差し指で操作';
    startCamera();
  } else {
    document.getElementById('camBtn').textContent='📷 カメラON';
    document.getElementById('camBtn').classList.add('off');
    infoEl.textContent='AUTO MODE';
    stopCamera();
  }
});

draw();
</script>
</body>
</html>
