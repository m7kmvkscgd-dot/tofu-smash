<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>豆腐スマッシュ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body {
  width:100%; height:100%;
  background:#1a0a00;
  display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start;
  font-family:Georgia,serif;
  touch-action:none; overflow:hidden;
}
#scoreEl {
  color:#ff8c42; font-size:20px; font-weight:bold;
  letter-spacing:4px; padding:8px 0 6px;
  text-shadow:0 0 20px #ff8c4288; flex-shrink:0;
}
#wrap {
  position:relative;
  flex-shrink:1;
  /* 画面幅に合わせてcanvasをスケール */
  width:min(100vw, 340px);
  aspect-ratio: 300/460;
}
#canvas {
  width:100%; height:100%;
  border:2px solid #ff8c4244; border-radius:4px;
  background:#0d0500; box-shadow:0 0 30px #ff8c4222;
  display:block;
}
#vid {
  position:absolute; bottom:6px; right:6px;
  width:80px; height:60px; object-fit:cover;
  border-radius:4px; border:1px solid #ff8c4266;
  opacity:0; transition:opacity .3s;
}
#btns {
  display:flex; gap:10px; padding:8px 0 4px;
  flex-shrink:0;
}
.btn {
  padding:9px 18px; font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:2px; border:none;
}
#btnStart { background:#ff8c42; color:#1a0a00; }
#btnCam   { background:transparent; border:1px solid #ff8c4255; color:#ff8c42; }
#statusEl {
  color:#ff8c4266; font-size:11px;
  padding-bottom:6px; flex-shrink:0;
}
</style>
</head>
<body>

<div id="scoreEl">SMASH: <span id="scoreNum">0</span></div>
<div id="wrap">
  <canvas id="canvas" width="300" height="460"></canvas>
  <video id="vid" autoplay playsinline muted></video>
</div>
<div id="btns">
  <button class="btn" id="btnStart">START</button>
  <button class="btn" id="btnCam">📷 カメラON</button>
</div>
<div id="statusEl">AUTO MODE</div>

<script>
const W = 300, H = 460;
const canvas    = document.getElementById('canvas');
const ctx       = canvas.getContext('2d');
const vid       = document.getElementById('vid');
const statusEl  = document.getElementById('statusEl');
const scoreNumEl= document.getElementById('scoreNum');

let running = false, camOn = false;
let fingerY = null, score = 0, animId = null;

const rod = { x:150, y:50, w:22, h:100, dir:1, speed:7, prevY:50 };

function newTofu() {
  return { x:90, y:310, w:120, h:100, hp:100, cracks:[], shakeX:0, shakeT:0, dead:false };
}
let tofu = newTofu();
let parts = [];

function addCrack() {
  tofu.cracks.push({
    cx:  tofu.x + 10 + Math.random()*(tofu.w-20),
    cy:  tofu.y + 10 + Math.random()*(tofu.h-20),
    ang: Math.random()*Math.PI,
    len: 12 + Math.random()*26
  });
}

function spawnParts(x, y, n) {
  for (let i=0; i<n; i++) parts.push({
    x: x+(Math.random()-.5)*60, y,
    vx:(Math.random()-.5)*6, vy:-(Math.random()*7+2),
    sz:Math.random()*10+3, a:1,
    col:`hsl(${38+Math.random()*18},85%,${68+Math.random()*20}%)`
  });
}

function onHit() {
  if (tofu.dead) return;
  tofu.hp -= 8; score += 8;
  scoreNumEl.textContent = score;
  tofu.shakeX=8; tofu.shakeT=10;
  addCrack();
  if (tofu.hp < 50) addCrack();
  spawnParts(tofu.x+tofu.w/2, tofu.y+10, 5);
  if (tofu.hp <= 0) {
    tofu.dead = true;
    spawnParts(tofu.x+tofu.w/2, tofu.y+tofu.h/2, 22);
    setTimeout(() => { tofu = newTofu(); }, 900);
  }
}

function update() {
  rod.prevY = rod.y;
  if (camOn && fingerY !== null) {
    const target = Math.max(10, Math.min(H-rod.h-10, fingerY-rod.h));
    rod.y += (target-rod.y)*0.35;
  } else {
    rod.y += rod.speed*rod.dir;
    if (rod.y <= 10)            { rod.dir=1;  rod.y=10; }
    if (rod.y >= H-rod.h-10)    { rod.dir=-1; }
  }

  const bottom   = rod.y+rod.h;
  const wasAbove = rod.prevY+rod.h <= tofu.y;
  const hitting  = bottom >= tofu.y && rod.y < tofu.y+tofu.h;

  if (!tofu.dead && hitting) {
    if (camOn) {
      if (wasAbove && (rod.y-rod.prevY) > 0.3) { onHit(); rod.y=tofu.y-rod.h; }
    } else {
      if (wasAbove) { onHit(); rod.dir=-1; rod.y=tofu.y-rod.h; }
    }
  }

  if (tofu.shakeT>0) { tofu.shakeT--; tofu.shakeX=tofu.shakeT>0?(Math.random()-.5)*8:0; }
  parts = parts.filter(p=>p.a>0.04);
  for (const p of parts) { p.x+=p.vx; p.y+=p.vy; p.vy+=0.22; p.a-=0.028; p.sz*=0.97; }
}

function render() {
  ctx.fillStyle='#0d0500'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#ff8c4218'; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(0,H-20); ctx.lineTo(W,H-20); ctx.stroke();

  // 指ライン
  if (camOn && fingerY !== null) {
    ctx.strokeStyle='rgba(255,140,66,0.5)';
    ctx.lineWidth=1; ctx.setLineDash([5,5]);
    ctx.beginPath(); ctx.moveTo(0,fingerY); ctx.lineTo(W,fingerY); ctx.stroke();
    ctx.setLineDash([]);
  }

  // 豆腐
  if (!tofu.dead) {
    const tx=tofu.x+tofu.shakeX, ty=tofu.y;
    const d=1-tofu.hp/100, v=Math.floor(218-d*60);
    ctx.fillStyle=`rgb(${v},${v},${v-8})`;
    ctx.beginPath(); ctx.roundRect(tx,ty,tofu.w,tofu.h,5); ctx.fill();
    ctx.strokeStyle='rgba(190,190,190,0.2)'; ctx.lineWidth=0.5;
    for (let i=1;i<4;i++) {
      ctx.beginPath(); ctx.moveTo(tx+10,ty+(tofu.h/4)*i); ctx.lineTo(tx+tofu.w-10,ty+(tofu.h/4)*i); ctx.stroke();
    }
    const r=tofu.hp/100;
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(tx,ty-12,tofu.w,6);
    ctx.fillStyle=r>.5?'#4ade80':r>.25?'#facc15':'#f87171';
    ctx.fillRect(tx,ty-12,tofu.w*r,6);
    for (const c of tofu.cracks) {
      ctx.save(); ctx.translate(c.cx+tofu.shakeX,c.cy); ctx.rotate(c.ang);
      ctx.strokeStyle='rgba(90,70,50,0.75)'; ctx.lineWidth=1.5;
      ctx.beginPath(); ctx.moveTo(-c.len/2,0); ctx.lineTo(c.len/2,0); ctx.stroke();
      ctx.restore();
    }
  }

  // パーティクル
  for (const p of parts) {
    ctx.globalAlpha=p.a; ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.roundRect(p.x-p.sz/2,p.y-p.sz/2,p.sz,p.sz,2); ctx.fill();
  }
  ctx.globalAlpha=1;

  // ロッド
  const rx=rod.x-rod.w/2;
  const gr=ctx.createLinearGradient(rx,0,rx+rod.w,0);
  gr.addColorStop(0,'#b8611f'); gr.addColorStop(.3,'#f09848');
  gr.addColorStop(.7,'#d87830'); gr.addColorStop(1,'#9a4818');
  ctx.fillStyle=gr;
  ctx.beginPath(); ctx.roundRect(rx,rod.y,rod.w,rod.h,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.roundRect(rx+4,rod.y+5,6,rod.h-10,3); ctx.fill();
  if (rod.y+rod.h>tofu.y-25) {
    ctx.fillStyle='rgba(255,170,70,0.32)';
    ctx.beginPath(); ctx.ellipse(rod.x,rod.y+rod.h,rod.w/2+2,9,0,0,Math.PI*2); ctx.fill();
  }
}

function loop() {
  if (!running) return;
  update(); render();
  animId = requestAnimationFrame(loop);
}

// ── カメラ・指検出 ──────────────────────
let offscreen=null, offCtx=null, camStream=null;
let lastCamTime=0;

async function startCam() {
  statusEl.textContent='カメラ起動中...';
  try {
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:{exact:'environment'}, width:320, height:240 }
      });
      vid.style.transform='scaleX(1)';
    } catch {
      camStream = await navigator.mediaDevices.getUserMedia({
        video:{ facingMode:'user', width:320, height:240 }
      });
      vid.style.transform='scaleX(-1)';
    }
    vid.srcObject=camStream;
    await vid.play();
    vid.style.opacity='0.85';

    offscreen=document.createElement('canvas');
    offscreen.width=80; offscreen.height=60;
    offCtx=offscreen.getContext('2d',{willReadFrequently:true});

    statusEl.textContent='🖐 指をカメラに向けて';
    camLoop();
  } catch(e) {
    statusEl.textContent='カメラエラー: '+e.message;
    camOn=false;
    document.getElementById('btnCam').textContent='📷 カメラON';
  }
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream=null; }
  vid.style.opacity='0'; fingerY=null;
}

function camLoop() {
  if (!camOn) return;
  requestAnimationFrame(camLoop);
  const now=performance.now();
  if (now-lastCamTime<80) return;
  lastCamTime=now;
  if (vid.readyState<2) return;

  offCtx.drawImage(vid,0,0,80,60);
  const data=offCtx.getImageData(0,0,80,60).data;

  // 上から走査して肌色の最上端Y座標を探す
  let found=-1;
  outer:
  for (let y=0; y<60; y++) {
    for (let x=5; x<75; x++) {
      const i=(y*80+x)*4;
      if (isSkin(data[i],data[i+1],data[i+2])) { found=y; break outer; }
    }
  }

  if (found>=0) {
    fingerY=(found/60)*H;
    statusEl.textContent='👆 検出中 y='+Math.round(fingerY);
  } else {
    statusEl.textContent='🖐 指をカメラに向けて';
  }
}

function isSkin(r,g,b) {
  // RGB直接判定（幅広め）
  return r>95 && g>40 && b>20
      && r>g && r>b
      && (r-Math.min(g,b))>15
      && Math.abs(r-g)>15;
}

document.getElementById('btnStart').addEventListener('click',()=>{
  if (running) {
    running=false; cancelAnimationFrame(animId);
    document.getElementById('btnStart').textContent='START';
    score=0; scoreNumEl.textContent=0;
    rod.y=50; rod.dir=1; tofu=newTofu(); parts=[]; render();
  } else {
    running=true;
    document.getElementById('btnStart').textContent='STOP';
    loop();
  }
});

document.getElementById('btnCam').addEventListener('click',()=>{
  camOn=!camOn;
  if (camOn) {
    document.getElementById('btnCam').textContent='📷 カメラOFF';
    startCam();
  } else {
    document.getElementById('btnCam').textContent='📷 カメラON';
    stopCam();
    statusEl.textContent='AUTO MODE';
  }
});

render();
</script>
</body>
</html>
