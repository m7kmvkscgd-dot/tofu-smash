<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>豆腐スマッシュ</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#1a0a00;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  min-height:100vh; font-family:Georgia,serif;
  touch-action:none; overflow:hidden;
}
#scoreEl {
  color:#ff8c42; font-size:26px; font-weight:bold;
  letter-spacing:4px; margin-bottom:10px;
  text-shadow:0 0 20px #ff8c4288;
}
#wrap { position:relative; width:300px; height:500px; }
#canvas {
  display:block; width:300px; height:500px;
  border:2px solid #ff8c4244; border-radius:4px;
  background:#0d0500; box-shadow:0 0 40px #ff8c4222;
}
#vid {
  position:absolute; bottom:6px; right:6px;
  width:90px; height:68px; object-fit:cover;
  border-radius:4px; border:1px solid #ff8c4266;
  opacity:0; transition:opacity .3s;
  transform:scaleX(-1); /* アウトカメラなので反転なし後で対応 */
}
#btns { margin-top:14px; display:flex; gap:10px; }
.btn {
  padding:10px 22px; font-size:13px; font-weight:bold;
  letter-spacing:2px; cursor:pointer; border-radius:2px; border:none;
}
#btnStart { background:#ff8c42; color:#1a0a00; }
#btnCam { background:transparent; border:1px solid #ff8c4255; color:#ff8c42; }
#statusEl { color:#ff8c4266; font-size:11px; margin-top:6px; letter-spacing:1px; }
</style>
</head>
<body>

<div id="scoreEl">SMASH: <span id="scoreNum">0</span></div>
<div id="wrap">
  <canvas id="canvas" width="300" height="500"></canvas>
  <video id="vid" autoplay playsinline muted></video>
</div>
<div id="btns">
  <button class="btn" id="btnStart">START</button>
  <button class="btn" id="btnCam">📷 カメラON</button>
</div>
<div id="statusEl">AUTO MODE</div>

<script>
// ─── 定数 ───────────────────────────────
const W = 300, H = 500;

// ─── 要素 ───────────────────────────────
const canvas = document.getElementById('canvas');
const ctx    = canvas.getContext('2d');
const vid    = document.getElementById('vid');
const statusEl = document.getElementById('statusEl');
const scoreNumEl = document.getElementById('scoreNum');

// ─── 状態 ───────────────────────────────
let running    = false;
let camOn      = false;
let fingerY    = null;   // canvas座標系でのY
let score      = 0;
let animId     = null;

// ─── ロッド ─────────────────────────────
const rod = {
  x: 150, y: 60, w: 22, h: 110,
  dir: 1, speed: 7, prevY: 60
};

// ─── 豆腐 ───────────────────────────────
let tofu = newTofu();
function newTofu() {
  return { x:90, y:330, w:120, h:110, hp:100, cracks:[], shakeX:0, shakeT:0, dead:false };
}

// ─── パーティクル ─────────────────────────
let parts = [];

function addCrack() {
  const t = tofu;
  t.cracks.push({
    cx: t.x + 10 + Math.random()*(t.w-20),
    cy: t.y + 10 + Math.random()*(t.h-20),
    ang: Math.random()*Math.PI,
    len: 12 + Math.random()*28
  });
}

function spawnParts(x, y, n) {
  for (let i=0; i<n; i++) {
    parts.push({
      x: x + (Math.random()-.5)*60,
      y: y,
      vx: (Math.random()-.5)*6,
      vy: -(Math.random()*7+2),
      sz: Math.random()*10+3,
      a: 1,
      col: `hsl(${38+Math.random()*18},85%,${68+Math.random()*20}%)`
    });
  }
}

function onHit() {
  if (tofu.dead) return;
  tofu.hp -= 8;
  score   += 8;
  scoreNumEl.textContent = score;
  tofu.shakeX = 8;
  tofu.shakeT = 10;
  addCrack();
  if (tofu.hp < 50) addCrack();
  spawnParts(tofu.x + tofu.w/2, tofu.y + 10, 5);

  if (tofu.hp <= 0) {
    tofu.dead = true;
    spawnParts(tofu.x + tofu.w/2, tofu.y + tofu.h/2, 22);
    setTimeout(() => { tofu = newTofu(); }, 900);
  }
}

// ─── 更新 ────────────────────────────────
function update() {
  rod.prevY = rod.y;

  if (camOn && fingerY !== null) {
    // 指のY座標にロッド先端を追従
    const target = Math.max(10, Math.min(H - rod.h - 10, fingerY - rod.h));
    rod.y += (target - rod.y) * 0.35;
  } else {
    // オートピストン
    rod.y += rod.speed * rod.dir;
    if (rod.y <= 10)           { rod.dir =  1; rod.y = 10; }
    if (rod.y >= H - rod.h - 10) { rod.dir = -1; }
  }

  // 当たり判定
  const bottom  = rod.y + rod.h;
  const wasAbove = rod.prevY + rod.h <= tofu.y;
  const hitting  = bottom >= tofu.y && rod.y < tofu.y + tofu.h;

  if (!tofu.dead && hitting) {
    if (camOn) {
      // カメラモード: 下向きに動いて豆腐に触れたとき
      if (wasAbove && (rod.y - rod.prevY) > 0.3) {
        onHit();
        rod.y = tofu.y - rod.h;
      }
    } else {
      // オートモード: 上から突き刺さったとき
      if (wasAbove) {
        onHit();
        rod.dir = -1;
        rod.y   = tofu.y - rod.h;
      }
    }
  }

  // 豆腐シェイク
  if (tofu.shakeT > 0) {
    tofu.shakeT--;
    tofu.shakeX = tofu.shakeT > 0 ? (Math.random()-.5)*8 : 0;
  }

  // パーティクル
  parts = parts.filter(p => p.a > 0.04);
  for (const p of parts) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.22;
    p.a  -= 0.028; p.sz *= 0.97;
  }
}

// ─── 描画 ────────────────────────────────
function drawBg() {
  ctx.fillStyle = '#0d0500';
  ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = '#ff8c4218';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(0,H-30); ctx.lineTo(W,H-30); ctx.stroke();
}

function drawTofu() {
  if (tofu.dead) return;
  const tx = tofu.x + tofu.shakeX;
  const ty = tofu.y;

  // 影
  ctx.fillStyle = 'rgba(255,255,255,0.03)';
  ctx.fillRect(tx+5, ty+5, tofu.w, tofu.h);

  // 本体
  const d = 1 - tofu.hp/100;
  const v = Math.floor(218 - d*60);
  ctx.fillStyle = `rgb(${v},${v},${v-8})`;
  ctx.beginPath(); ctx.roundRect(tx, ty, tofu.w, tofu.h, 5); ctx.fill();

  // テクスチャ
  ctx.strokeStyle = 'rgba(190,190,190,0.2)';
  ctx.lineWidth = 0.5;
  for (let i=1; i<4; i++) {
    ctx.beginPath();
    ctx.moveTo(tx+10, ty+(tofu.h/4)*i);
    ctx.lineTo(tx+tofu.w-10, ty+(tofu.h/4)*i);
    ctx.stroke();
  }

  // HPバー
  const r = tofu.hp/100;
  ctx.fillStyle = '#1a1a1a';
  ctx.fillRect(tx, ty-14, tofu.w, 7);
  ctx.fillStyle = r > .5 ? '#4ade80' : r > .25 ? '#facc15' : '#f87171';
  ctx.fillRect(tx, ty-14, tofu.w*r, 7);

  // ひび
  for (const c of tofu.cracks) {
    ctx.save();
    ctx.translate(c.cx + tofu.shakeX, c.cy);
    ctx.rotate(c.ang);
    ctx.strokeStyle = 'rgba(90,70,50,0.75)';
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(-c.len/2, 0); ctx.lineTo(c.len/2, 0); ctx.stroke();
    ctx.restore();
  }
}

function drawRod() {
  const rx = rod.x - rod.w/2;
  const gr = ctx.createLinearGradient(rx, 0, rx+rod.w, 0);
  gr.addColorStop(0,   '#b8611f');
  gr.addColorStop(0.3, '#f09848');
  gr.addColorStop(0.7, '#d87830');
  gr.addColorStop(1,   '#9a4818');
  ctx.fillStyle = gr;
  ctx.beginPath(); ctx.roundRect(rx, rod.y, rod.w, rod.h, 7); ctx.fill();

  // ハイライト
  ctx.fillStyle = 'rgba(255,255,255,0.22)';
  ctx.beginPath(); ctx.roundRect(rx+4, rod.y+5, 6, rod.h-10, 3); ctx.fill();

  // 先端グロー
  if (rod.y + rod.h > tofu.y - 25) {
    ctx.fillStyle = 'rgba(255,170,70,0.32)';
    ctx.beginPath();
    ctx.ellipse(rod.x, rod.y+rod.h, rod.w/2+2, 9, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawParts() {
  for (const p of parts) {
    ctx.globalAlpha = p.a;
    ctx.fillStyle   = p.col;
    ctx.beginPath();
    ctx.roundRect(p.x-p.sz/2, p.y-p.sz/2, p.sz, p.sz, 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawFingerLine() {
  if (!camOn || fingerY === null) return;
  ctx.strokeStyle = 'rgba(255,140,66,0.45)';
  ctx.lineWidth   = 1;
  ctx.setLineDash([5, 5]);
  ctx.beginPath(); ctx.moveTo(0, fingerY); ctx.lineTo(W, fingerY); ctx.stroke();
  ctx.setLineDash([]);
}

function render() {
  drawBg();
  drawFingerLine();
  drawTofu();
  drawParts();
  drawRod();
}

function loop() {
  if (!running) return;
  update();
  render();
  animId = requestAnimationFrame(loop);
}

// ─── カメラ + 指検出（色ベース） ───────────
let offscreen = null, offCtx = null;
let camStream = null;
let camLoopId = null;

async function startCam() {
  statusEl.textContent = 'カメラ起動中...';
  try {
    // アウトカメラ優先
    try {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { exact: 'environment' }, width:320, height:240 }
      });
      vid.style.transform = 'scaleX(1)'; // アウトカメラは反転不要
    } catch {
      camStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width:320, height:240 }
      });
      vid.style.transform = 'scaleX(-1)';
    }
    vid.srcObject = camStream;
    await vid.play();
    vid.style.opacity = '0.85';

    offscreen = document.createElement('canvas');
    offscreen.width  = 80;
    offscreen.height = 60;
    offCtx = offscreen.getContext('2d', { willReadFrequently: true });

    statusEl.textContent = '🖐 指をカメラに';
    camDetectLoop();

  } catch(e) {
    statusEl.textContent = 'カメラエラー: ' + e.message;
    camOn = false;
    document.getElementById('btnCam').textContent = '📷 カメラON';
  }
}

function stopCam() {
  if (camStream) { camStream.getTracks().forEach(t => t.stop()); camStream = null; }
  vid.style.opacity = '0';
  fingerY = null;
  if (camLoopId) cancelAnimationFrame(camLoopId);
}

// 肌色検出で指先Y座標を求める
let lastCamTime = 0;
function camDetectLoop() {
  if (!camOn) return;
  camLoopId = requestAnimationFrame(camDetectLoop);

  const now = performance.now();
  if (now - lastCamTime < 80) return; // 約12fps
  lastCamTime = now;

  if (vid.readyState < 2) return;

  offCtx.drawImage(vid, 0, 0, 80, 60);
  const data = offCtx.getImageData(0, 0, 80, 60).data;

  // 肌色に近いピクセルの最小Y（最上端）を指先とする
  let minY = -1;
  for (let y = 0; y < 60; y++) {
    for (let x = 0; x < 80; x++) {
      const i = (y*80+x)*4;
      const r = data[i], g = data[i+1], b = data[i+2];
      if (isSkin(r,g,b)) {
        if (minY < 0) minY = y;
        break;
      }
    }
    if (minY >= 0) break;
  }

  if (minY >= 0) {
    // offscreenの座標(0-60) → canvas座標(0-500)
    fingerY = (minY / 60) * H;
    statusEl.textContent = '👆 検出中';
  } else {
    statusEl.textContent = '🖐 指をカメラに向けて';
  }
}

function isSkin(r, g, b) {
  // YCbCr色空間で肌色判定
  const Y  =  0.299*r + 0.587*g + 0.114*b;
  const Cb = -0.169*r - 0.331*g + 0.500*b + 128;
  const Cr =  0.500*r - 0.419*g - 0.081*b + 128;
  return Y > 80 && Cb >= 77 && Cb <= 127 && Cr >= 133 && Cr <= 173;
}

// ─── ボタン ──────────────────────────────
document.getElementById('btnStart').addEventListener('click', () => {
  if (running) {
    running = false;
    cancelAnimationFrame(animId);
    document.getElementById('btnStart').textContent = 'START';
    score = 0; scoreNumEl.textContent = 0;
    rod.y = 60; rod.dir = 1;
    tofu = newTofu();
    parts = [];
    render();
  } else {
    running = true;
    document.getElementById('btnStart').textContent = 'STOP';
    loop();
  }
});

document.getElementById('btnCam').addEventListener('click', () => {
  camOn = !camOn;
  if (camOn) {
    document.getElementById('btnCam').textContent = '📷 カメラOFF';
    startCam();
  } else {
    document.getElementById('btnCam').textContent = '📷 カメラON';
    stopCam();
    statusEl.textContent = 'AUTO MODE';
  }
});

// ─── 初期描画 ────────────────────────────
render();
</script>
</body>
</html>
